name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rhfolha
          POSTGRES_USER: rhfolha
          POSTGRES_PASSWORD: rhfolha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rhfolha" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rhfolha:rhfolha@127.0.0.1:5432/rhfolha?serverVersion=16&charset=utf8
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, gd, zip
          ini-values: date.timezone=America/Sao_Paulo
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Chaves JWT
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Estilo (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Lint de Twig, YAML e container
        run: |
          php bin/console lint:twig templates
          php bin/console lint:yaml config
          php bin/console lint:container

      - name: Análise estática (PHPStan nível 6)
        run: |
          php bin/console cache:warmup --env=dev
          vendor/bin/phpstan analyse --no-progress

      - name: Banco de teste
        run: |
          php bin/console --env=test doctrine:database:create --if-not-exists
          php bin/console --env=test doctrine:migrations:migrate -n
          php bin/console --env=test doctrine:schema:validate
          php bin/console --env=test doctrine:fixtures:load -n --purge-with-truncate

      # Antes dos testes: as telas Twig do painel referenciam o CSS compilado
      - name: Build do CSS do painel (Tailwind)
        run: php bin/console tailwind:build --minify

      - name: Testes (PHPUnit)
        run: php bin/phpunit

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
