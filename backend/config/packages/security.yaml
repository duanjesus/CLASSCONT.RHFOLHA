security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        funcionarios:
            entity:
                class: App\Entity\Funcionario
                property: email

    # ROLE_CHEFIA não é gravado no banco: é derivado de "ser chefe de algum setor"
    # (ver Funcionario::getRoles()).
    role_hierarchy:
        ROLE_RH: [ROLE_FUNCIONARIO]
        ROLE_CHEFIA: [ROLE_FUNCIONARIO]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # POST /api/login → { token }
        api_login:
            pattern: ^/api/login$
            stateless: true
            provider: funcionarios
            user_checker: App\Security\FuncionarioAtivoChecker
            # Força bruta: 5 tentativas erradas por e-mail+IP a cada minuto → HTTP 429
            login_throttling:
                max_attempts: 5
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # API consumida pelo front React: stateless, autenticada por JWT
        api:
            pattern: ^/api
            stateless: true
            provider: funcionarios
            user_checker: App\Security\FuncionarioAtivoChecker
            jwt: ~

        # Painel administrativo em Twig: sessão + formulário de login
        admin:
            lazy: true
            provider: funcionarios
            user_checker: App\Security\FuncionarioAtivoChecker
            login_throttling:
                max_attempts: 5
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin_dashboard
                enable_csrf: true
                username_parameter: email
                password_parameter: senha
            logout:
                path: admin_logout
                target: admin_login

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_FUNCIONARIO }
        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_RH }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
