name: rhfolha

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/app
      # vendor/ e var/ em volumes nomeados: no Windows/macOS o bind mount
      # dessas pastas deixa cada request vários segundos mais lento.
      - backend_vendor:/var/www/app/vendor
      - backend_var:/var/www/app/var
    environment:
      DATABASE_URL: postgresql://rhfolha:rhfolha@db:5432/rhfolha?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      LOAD_FIXTURES: "1"
    depends_on:
      db:
        condition: service_healthy

  # Consome a fila do Messenger (envio de e-mails). Espera o php terminar a
  # instalação/migrations e reinicia sozinho a cada hora (--time-limit) ou se cair.
  # Em dev, depois de alterar código usado pelo worker: docker compose restart worker
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command:
      - sh
      - -c
      - |
        until php bin/console messenger:stats async > /dev/null 2>&1; do
          echo "Aguardando a aplicação ficar pronta..."; sleep 3
        done
        exec php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -v
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/app
      - backend_vendor:/var/www/app/vendor
      - backend_var:/var/www/app/var
    environment:
      DATABASE_URL: postgresql://rhfolha:rhfolha@db:5432/rhfolha?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      - php

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./backend:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rhfolha
      POSTGRES_USER: rhfolha
      POSTGRES_PASSWORD: rhfolha
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhfolha -d rhfolha"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_PROXY_TARGET: http://nginx
      # eventos de arquivo não atravessam o bind mount no Windows: usa polling
      VITE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

volumes:
  backend_vendor:
  backend_var:
  db_data:
  frontend_node_modules:
